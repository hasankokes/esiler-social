# Marka ayarları. Renkler tüm şablonlarda buradan okunur.
marka_adi: Eşiler Triko
web: esiler.com.tr
instagram: "@esilertriko"
# Boş bırakılırsa görsellerde ve açıklamalarda sadece "Sipariş ve fiyat için DM" yazar.
# Numara yazılırsa: "Sipariş ve fiyat için WhatsApp: <numara> / DM"
whatsapp: ""
slogan: 60 yıldır aynı kalite, aynı güven

renkler:
  zemin: "#F5F0E8"      # krem
  koyu: "#1C2B3A"       # lacivert
  vurgu: "#B5622C"      # terrakota
  bej: "#D4C5A9"
  metin: "#2D2D2D"
  acik_metin: "#7A7A7A"
  cizgi: "#E2D9CC"

# OFL lisanslı fontlar (remotion/public/fonts). Türkçe karakter (ğ ş ı İ) destekli.
fontlar:
  baslik: Cormorant Garamond
  govde: DM Sans

etiketler:
  havuz:
    - "#toptantriko"
    - "#trikotoptan"
    - "#toptangiyim"
    - "#butiktedarik"
    - "#esilertriko"
  # Instagram: her paylaşımda min–max arası etiket (dönüşümlü seçilir)
  instagram_min: 3
  instagram_max: 5
  # Facebook'ta daha az etiket
  facebook: 2
  # Her zaman eklenecek etiket
  sabit: "#esilertriko"

