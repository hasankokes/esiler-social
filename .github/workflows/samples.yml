name: Örnek çıktılar

# Elle çalıştırılır. Her şablondan örnek üretir ve indirilebilir zip olarak bırakır (samples/ ile aynı).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ornekler:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libheif-examples > /dev/null
      - run: npx tsx src/cli.ts samples
      - uses: actions/upload-artifact@v4
        with:
          name: ornekler-${{ github.run_id }}
          path: samples/
          retention-days: 14
